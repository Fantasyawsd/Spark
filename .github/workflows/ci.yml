name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify version metadata
        shell: pwsh
        env:
          BASE_REVISION: ${{ github.ref_type == 'tag' && github.sha || github.event.pull_request.base.sha || github.event.before }}
          REQUIRE_RELEASE_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          $parameters = @{ BaseRevision = $env:BASE_REVISION }
          if ($env:REQUIRE_RELEASE_TAG -eq 'true') {
            $parameters.RequireReleaseTag = $true
          }
          ./tool/verify_version.ps1 @parameters

      - name: Check changed Dart formatting
        shell: pwsh
        env:
          BASE_REVISION: ${{ github.ref_type == 'tag' && github.sha || github.event.pull_request.base.sha || github.event.before }}
        run: ./tool/verify_changed_dart_format.ps1 -BaseRevision $env:BASE_REVISION

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build development APK
        run: >-
          flutter build apk --debug
          --flavor development
          --dart-define=PAPERFLOW_ENV=development

      - name: Build production debug APK
        run: >-
          flutter build apk --debug
          --flavor production
          --dart-define=PAPERFLOW_ENV=production

      - name: Verify unsigned production release is blocked
        shell: pwsh
        run: |
          $output = @(& ./android/gradlew -p android :app:assembleProductionRelease 2>&1)
          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 0) {
            throw 'Unsigned production release unexpectedly succeeded.'
          }
          if ($output -notmatch 'Release signing is not configured') {
            $output | Write-Output
            throw 'Production release failed for an unexpected reason.'
          }

      - name: Upload development APK
        uses: actions/upload-artifact@v4
        with:
          name: paperflow-development-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-development-debug.apk
          if-no-files-found: error
          retention-days: 7
