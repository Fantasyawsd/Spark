name: Server CI

on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build-test prerequisites
        run: python -m pip install "setuptools>=68" wheel
      - name: Compile server sources
        run: python -m compileall -q server/spark_papers server/tests
      - name: Check architecture boundaries
        run: python -m unittest discover -s server/tests -t server -p test_server_architecture.py -v
      - name: Run all server tests
        run: python -m unittest discover -s server/tests -t server -v
