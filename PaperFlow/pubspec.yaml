name: paperflow
description: A paper discovery and research community app with a TikTok-inspired reading flow.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_markdown_plus_latex: ^1.0.5
  flutter_secure_storage: 10.3.1
  flutter_staggered_grid_view: ^0.7.0
  http: ^1.5.0
  markdown: ^7.3.1
  url_launcher: ^6.3.2
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/paperflow_logo.png
